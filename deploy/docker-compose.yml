# Produktivbetrieb: Caddy (HTTPS) + Frontend + Backend + tägliche Datenbank-Sicherung.
# Anleitung: deploy/README.md
#
#   cd deploy
#   cp .env.example .env        # Werte eintragen
#   docker compose up -d --build

name: schoppmann-zeiterfassung

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_STORAGE: /data/timetracking.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in deploy/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET fehlt in deploy/.env}
      CORS_ORIGIN: https://${DOMAIN:?DOMAIN fehlt in deploy/.env}
      # Hinter Caddy: ein Proxy – nötig, damit Rate-Limits die echte Client-IP sehen
      TRUST_PROXY: "1"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
    volumes:
      - db-data:/data
      # nur lesend: für die Wiederherstellung (npm run db:restore) aus dem Backend-Container
      - backups:/backups:ro
    expose:
      - "5000"

  frontend:
    build:
      context: ../frontend
      args:
        # Das Backend liegt hinter derselben Adresse unter /api (siehe Caddyfile)
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?DOMAIN fehlt in deploy/.env}
        NEXT_PUBLIC_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Sicherung der Datenbank beim Start und danach alle 24 Stunden (aufbewahrt: BACKUP_KEEP Stück).
  # Die Dateien liegen im Volume "backups" auf dem Server – regelmäßig extern ablegen (deploy/README.md)!
  backup:
    build:
      context: ../backend
    restart: unless-stopped
    command:
      - sh
      - -c
      - while true; do node scripts/backup-db.js || echo "Sicherung fehlgeschlagen"; sleep 86400; done
    environment:
      DB_STORAGE: /data/timetracking.db
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
    volumes:
      - db-data:/data
      - backups:/backups

volumes:
  db-data:
  backups:
  caddy-data:
  caddy-config:
