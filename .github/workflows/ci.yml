name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typprüfung, Unit-, Integrations- und Smoke-Tests (temporäre SQLite-DB)
        run: npm test
      - name: Produktions-Build (TypeScript → dist/)
        run: npm run build
      - name: Schema und Migrationen deckungsgleich (keine ungenerierte Schemaänderung)
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name ci-drift-check | tee drift.log
          if ! grep -q "No schema changes" drift.log; then
            echo "::error::src/db/schema.ts wurde geändert, aber keine Migration erzeugt (npm run db:generate)"; exit 1
          fi
      - name: Sicherheitsprüfung (nur Laufzeit-Abhängigkeiten, ab "high")
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Produktions-Build
        run: npm run build
      - name: Sicherheitsprüfung (nur Laufzeit-Abhängigkeiten, ab "high")
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit meldet Funde (siehe Log)"

  # Prüft die Betriebsdateien (deploy/, Dockerfiles), die lokal nicht ohne Docker testbar sind
  docker:
    runs-on: ubuntu-latest
    env:
      TEST_JWT_SECRET: ci_test_jwt_secret_with_more_than_32_characters
      TEST_JWT_REFRESH: ci_test_refresh_secret_with_more_than_32_chars
    steps:
      - uses: actions/checkout@v4

      - name: Compose-Datei prüfen
        working-directory: deploy
        env:
          DOMAIN: zeit.example.de
          NAS_BACKUP_DIR: /mnt/nas-test
          JWT_SECRET: ${{ env.TEST_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.TEST_JWT_REFRESH }}
        run: docker compose config --quiet

      - name: Caddyfile prüfen (interne CA, Standard)
        run: >
          docker run --rm -e DOMAIN=zeit.example.de
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile

      - name: Caddyfile prüfen (mit E-Mail für Let's Encrypt)
        run: >
          docker run --rm -e DOMAIN=zeit.example.de -e TLS_MODE=admin@example.de
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile

      - name: Backend-Image bauen
        run: docker build -t zeit-backend backend

      - name: Frontend-Image bauen
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://zeit.example.de -t zeit-frontend frontend

      - name: Images starten und prüfen
        run: |
          mkdir -p "$PWD/nas-test" && chmod 777 "$PWD/nas-test"
          touch "$PWD/nas-test/.zeiterfassung-offsite" && chmod 666 "$PWD/nas-test/.zeiterfassung-offsite"
          docker run -d --name be -p 5000:5000 \
            -v "$PWD/nas-test:/nas" -e OFFSITE_DIR=/nas -e BACKUP_DIR=/backups \
            -e JWT_SECRET="$TEST_JWT_SECRET" -e JWT_REFRESH_SECRET="$TEST_JWT_REFRESH" zeit-backend
          docker run -d --name fe -p 3000:3000 zeit-frontend
          for i in $(seq 1 30); do curl -fs http://localhost:5000/health && break; sleep 2; done
          curl -fs http://localhost:5000/api/status
          curl -fs -o /dev/null http://localhost:3000/login
          echo "Backend- und Frontend-Container antworten"

      - name: Admin anlegen, Sicherung auf simuliertes NAS, Status
        run: |
          docker exec be node dist/scripts/create-admin.js --email=ci@example.de --name=CI --generate
          docker exec be node dist/scripts/backup-db.js
          echo "--- Inhalt des simulierten NAS:"; ls -la nas-test
          ls nas-test | grep -q '^timetracking-.*\.db$'
          docker exec be node dist/scripts/backup-healthcheck.js

      - name: NAS nicht eingebunden → Fehler wird erkannt (Markierungsdatei fehlt)
        run: |
          rm nas-test/.zeiterfassung-offsite
          if docker exec be node dist/scripts/backup-db.js; then
            echo "FEHLER: Sicherung meldete Erfolg, obwohl das NAS nicht eingebunden war"; exit 1
          fi
          # die lokale Sicherung bleibt erhalten, der Zustand ist aber nicht mehr gesund oder zumindest gewarnt
          docker exec be sh -c 'cat /backups/status.json'
          docker exec be sh -c 'grep -q "\"ok\": false" /backups/status.json'

      - name: Backup-Dienst läuft als Dauerprozess
        run: |
          docker run --rm -v "$PWD/nas-test:/nas" -e OFFSITE_DIR=/nas -e BACKUP_DIR=/backups -e TZ=Europe/Berlin zeit-backend \
            timeout 20 node dist/scripts/backup-loop.js 2>&1 | tee loop.log || true
          grep -q "Nächste Sicherung um 02:30" loop.log

      - name: Container-Logs bei Fehlern
        if: failure()
        run: |
          docker logs be || true
          docker logs fe || true
