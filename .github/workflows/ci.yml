name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit-, Integrations- und Smoke-Tests (temporäre SQLite-DB)
        run: npm test
      - name: Sicherheitsprüfung (nur Laufzeit-Abhängigkeiten, ab "high")
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit meldet Funde (siehe Log)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Produktions-Build
        run: npm run build
      - name: Sicherheitsprüfung (nur Laufzeit-Abhängigkeiten, ab "high")
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit meldet Funde (siehe Log)"

  # Prüft die Betriebsdateien (deploy/, Dockerfiles), die lokal nicht ohne Docker testbar sind
  docker:
    runs-on: ubuntu-latest
    env:
      TEST_JWT_SECRET: ci_test_jwt_secret_with_more_than_32_characters
      TEST_JWT_REFRESH: ci_test_refresh_secret_with_more_than_32_chars
    steps:
      - uses: actions/checkout@v4

      - name: Compose-Datei prüfen
        working-directory: deploy
        env:
          DOMAIN: zeit.example.de
          JWT_SECRET: ${{ env.TEST_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.TEST_JWT_REFRESH }}
        run: docker compose config --quiet

      - name: Caddyfile prüfen
        run: >
          docker run --rm -e DOMAIN=zeit.example.de
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile

      - name: Backend-Image bauen
        run: docker build -t zeit-backend backend

      - name: Frontend-Image bauen
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://zeit.example.de -t zeit-frontend frontend

      - name: Images starten und prüfen
        run: |
          docker run -d --name be -p 5000:5000 \
            -e JWT_SECRET="$TEST_JWT_SECRET" -e JWT_REFRESH_SECRET="$TEST_JWT_REFRESH" zeit-backend
          docker run -d --name fe -p 3000:3000 zeit-frontend
          for i in $(seq 1 30); do curl -fs http://localhost:5000/health && break; sleep 2; done
          curl -fs http://localhost:5000/api/status
          curl -fs -o /dev/null http://localhost:3000/login
          echo "Backend- und Frontend-Container antworten"

      - name: Admin anlegen und Sicherung im Container
        run: |
          docker exec be node scripts/create-admin.js --email=ci@example.de --name=CI --generate
          docker exec be node scripts/backup-db.js
          docker exec be ls /backups

      - name: Container-Logs bei Fehlern
        if: failure()
        run: |
          docker logs be || true
          docker logs fe || true
